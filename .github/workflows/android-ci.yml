name: Android candidate checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * 1'

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check dependency gate regression tests
        run: node --test tools/check-dependencies.test.cjs
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check automotive candidates and write runtime inventory
        run: >-
          bash ./gradlew --no-daemon
          :app:testAutomotiveDebugUnitTest
          :app:testAutomotiveReleaseUnitTest
          :app:lintAutomotiveRelease
          :app:bundleAutomotiveRelease
          :app:writeAutomotiveReleaseInventory
      - name: Check resolved dependencies with OSV
        run: >-
          node tools/check-dependencies.cjs
          --inventory app/build/reports/release/runtime-components.json
          --output app/build/reports/release/dependency-security-scan.json
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automotive-candidate-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/bundle/automotiveRelease/*.aab

# Unsigned build evidence only. No signing variables, publishing credentials,
# pull_request_target, write permissions, deployments or automatic merges.
